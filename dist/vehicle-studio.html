<!doctype html>
<meta charset="utf-8">
<title>Vehicle studio</title>
<!-- Dev tool, not part of the game: scripts/render-vehicle-pictures.mjs opens this page in headless Edge and calls renderVehicle(model, colour) for every vehicle and colour,
     then writes dist/vehicle-pictures.js (the small pictures the phone's Store shows). Run `npm run pictures` with `npm run dev` serving the site. -->
<body style="margin:0;background:#00000000">
<script type="module">
import * as THREE from './vendor/three.module.js';
import {createProp,propInfo} from './props.js';
import {applyPaint} from './paint-shader.js';
const W=320,H=200;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H);renderer.setClearColor(0x000000,0);document.body.append(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(26,W/H,.1,200);
scene.add(new THREE.HemisphereLight(0xfff3dc,0x5d5a50,1.5));const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(-5,9,7);scene.add(sun);
const fade={apply:m=>m};
// Waits until the model's colour texture has loaded (props.js sets it from an Image).
const ready=mesh=>new Promise(resolve=>{const map=mesh.material.map;const t=setInterval(()=>{if(!map||(map.image&&map.image.complete&&map.image.width)){clearInterval(t);resolve()}},30)});
window.renderVehicle=async(model,colour)=>{
 const mesh=createProp(model,fade);mesh.rotation.y=0;scene.add(mesh);applyPaint(mesh,model,colour);await ready(mesh);
 const box=new THREE.Box3().setFromObject(mesh),size=box.getSize(new THREE.Vector3()),centre=box.getCenter(new THREE.Vector3()),span=Math.max(size.x,size.z)*.8+size.y*.3;
 // three-quarter view from the front left, framed on the whole vehicle
 const dir=new THREE.Vector3(.62,.34,.78).normalize(),dist=span/2/Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*1.05;
 camera.position.copy(centre).addScaledVector(dir,dist);camera.lookAt(centre.x,centre.y-size.y*.05,centre.z);camera.updateProjectionMatrix();
 await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
 renderer.render(scene,camera);const url=renderer.domElement.toDataURL('image/png');scene.remove(mesh);return url;
};
window.studioReady=true;
</script>
