<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eden Ridge · Welding Lab</title>
<style>
  :root{color-scheme:dark;font-family:system-ui,sans-serif;color:#f1eeea;background:#141b24}
  *{box-sizing:border-box}body{margin:0;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none}
  #controls,#debug,#result,#error{position:fixed;background:#10161ee8;border:1px solid #73809273;border-radius:12px;padding:14px 18px}
  #controls{top:16px;left:16px;max-width:360px}#debug{right:16px;top:16px;font:13px/1.6 ui-monospace,monospace;white-space:pre}
  #result{right:16px;bottom:16px;width:min(320px,calc(100vw - 32px))}#error{left:16px;bottom:16px;color:#ffc49d}
  h1{font-size:19px;margin:0 0 7px}h2{font-size:20px;margin:0 0 8px}p{font-size:13px;line-height:1.45;margin:6px 0 10px;color:#d7dce3}
  .buttons{display:flex;gap:6px;flex-wrap:wrap}button,select{font:inherit;font-size:13px;padding:7px 10px;border:1px solid #778295;border-radius:6px;background:#202b39;color:inherit}
  button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #ffc083}.primary{background:#683a24;border-color:#b47a54}
  .metrics{font-size:30px;font-weight:650;color:#ffc083}.foot{color:#aab7c7;font-size:12px;margin-bottom:0}
  @media(max-width:660px){#controls{max-width:290px;padding:10px}#debug{top:auto;bottom:12px}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
<section id="controls" aria-label="Welding controls">
  <h1>Welding Lab</h1>
  <select id="joint" aria-label="Joint">
    <option value="0">1 · Straight butt joint</option><option value="1">2 · Curved seam</option>
    <option value="2">3 · T-fillet</option><option value="3">4 · Lap joint</option>
  </select>
  <p>Move the mouse to aim. Hold left click for the arc. Hold Shift to brace. Hold Alt to lift the nozzle.</p>
  <div class="buttons">
    <button id="finish" class="primary" disabled>Finish weld</button>
    <button id="reset" disabled>Reset</button>
    <button id="capture" disabled>Capture mouse</button>
    <button id="mute" disabled>Mute</button>
  </div>
  <p class="foot">H · Debug &nbsp; R · Reset &nbsp; Enter · Finish</p>
</section>
<output id="debug" hidden aria-label="Welding telemetry"></output>
<section id="result" hidden aria-live="polite"><h2>Weld complete</h2><div id="score" class="metrics"></div><p id="details"></p><button id="retry">Try again</button></section>
<output id="error" role="status">Loading welding assets…</output>
<script type="module" src="./weld-lab.js"></script>
</body>
</html>
